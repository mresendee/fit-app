<script type="text/plain" id="fit-app-source">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ---------------------------------------------------------------------------
// ARMAZENAMENTO LOCAL — sem API tradicional. Tudo fica no localStorage do
// navegador. A sincronização entre aparelhos (opcional) fala com /api/sync,
// uma função serverless da própria Vercel.
// ---------------------------------------------------------------------------
const PREFIX = "fitapp_";
function load(key, fallback) { try { const raw = localStorage.getItem(PREFIX + key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } }
function save(key, value) { localStorage.setItem(PREFIX + key, JSON.stringify(value)); }

function calcularMetas({ pesoKg, alturaCm, idade, sexo, objetivo }) {
  const tmb = sexo === "feminino" ? 10*pesoKg+6.25*alturaCm-5*idade-161 : 10*pesoKg+6.25*alturaCm-5*idade+5;
  const manutencao = Math.round(tmb * 1.4);
  const ajustes = { emagrecer: -450, manter: 0, ganhar: 350 };
  const meta_calorica = manutencao + (ajustes[objetivo] ?? 0);
  const proteinaPorKg = objetivo === "ganhar" ? 2.0 : objetivo === "emagrecer" ? 2.2 : 1.6;
  const meta_proteina = Math.round(pesoKg * proteinaPorKg);
  const kcalProteina = meta_proteina * 4;
  const kcalGordura = meta_calorica * 0.27;
  const meta_gordura = Math.round(kcalGordura / 9);
  const meta_carbo = Math.round((meta_calorica - kcalProteina - kcalGordura) / 4);
  return { meta_calorica, meta_proteina, meta_carbo, meta_gordura };
}

const db = {
  getPerfil: () => load("perfil", null),
  savePerfil: (p) => { save("perfil", p); return p; },
  getGoals: () => load("goals", null),
  saveGoals: (g) => { save("goals", g); return g; },
  getFoodLogs: (data) => load("foodlogs", []).filter((i) => i.data === data),
  addFoodLog: (payload) => { const all = load("foodlogs", []); const item = { ...payload, id: Date.now() + Math.random() }; all.push(item); save("foodlogs", all); return item; },
  deleteFoodLog: (id) => { save("foodlogs", load("foodlogs", []).filter((i) => i.id !== id)); },
  getWorkouts: (data) => load("workouts", []).filter((w) => w.data === data),
  createWorkout: ({ nome, dia_semana, data, exercicios }) => {
    const workouts = load("workouts", []);
    const workout = { id: Date.now(), nome, dia_semana, data };
    workouts.push(workout);
    save("workouts", workouts);
    const todos = load("exercicios", []);
    exercicios.forEach((ex, i) => { todos.push({ id: Date.now() + i + 1, workout_id: workout.id, feito: 0, ...ex }); });
    save("exercicios", todos);
    return workout;
  },
  getExercicios: (workoutId) => load("exercicios", []).filter((e) => e.workout_id === workoutId),
  patchExercicio: (id, payload) => { save("exercicios", load("exercicios", []).map((e) => (e.id === id ? { ...e, ...payload } : e))); },
  limparTreinosDatas: (datas) => {
    const workouts = load("workouts", []);
    const idsRemover = workouts.filter((w) => datas.includes(w.data)).map((w) => w.id);
    save("workouts", workouts.filter((w) => !datas.includes(w.data)));
    save("exercicios", load("exercicios", []).filter((e) => !idsRemover.includes(e.workout_id)));
  },
  getWeightLogs: () => load("weightlogs", []).sort((a, b) => a.data.localeCompare(b.data)),
  addWeightLog: (payload) => { const all = load("weightlogs", []); all.push(payload); save("weightlogs", all); },
  getWaterTotal: (data) => load("waterlogs", {})[data] ?? 0,
  addWater: (data, delta) => { const map = load("waterlogs", {}); map[data] = Math.max((map[data] ?? 0) + delta, 0); save("waterlogs", map); return map[data]; },
  getSteps: (data) => load("steps", {})[data] ?? 0,
  setSteps: (data, valor) => { const map = load("steps", {}); map[data] = valor; save("steps", map); return valor; },
  limparTudo: () => { Object.keys(localStorage).filter((k) => k.startsWith(PREFIX)).forEach((k) => localStorage.removeItem(k)); },
  getSyncCode: () => load("synccode", null),
  saveSyncCode: (c) => { save("synccode", c); return c; },
  coletarTudo: () => {
    const dados = {};
    Object.keys(localStorage).filter((k) => k.startsWith(PREFIX) && k !== PREFIX + "synccode")
      .forEach((k) => { dados[k.replace(PREFIX, "")] = JSON.parse(localStorage.getItem(k)); });
    return dados;
  },
  aplicarTudo: (dados) => { Object.entries(dados).forEach(([k, v]) => save(k, v)); },
};

function gerarCodigo() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

const HOJE = new Date().toISOString().slice(0, 10);
function formatBR(iso) { const [, m, d] = iso.split("-"); return `${d}/${m}`; }

function semanaAtual() {
  const hoje = new Date(HOJE + "T00:00:00");
  const domingo = new Date(hoje);
  domingo.setDate(hoje.getDate() - hoje.getDay());
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(domingo);
    d.setDate(domingo.getDate() + i);
    return d.toISOString().slice(0, 10);
  });
}

function montarDiasSemana(objetivo) {
  const tmplObjetivo = TREINO_SEMANAL[objetivo] ?? TREINO_SEMANAL.manter;
  return semanaAtual().map((dataStr) => {
    const idx = new Date(dataStr + "T00:00:00").getDay();
    const tmpl = tmplObjetivo[idx];
    return { data: dataStr, label: DIAS_SEMANA_LABEL[idx], grupo: tmpl.grupo, hoje: dataStr === HOJE };
  });
}

// Busca o treino já salvo pra essa data ou gera automaticamente a partir do
// modelo semanal do objetivo da pessoa (não cria nada em dia de descanso).
function obterOuCriarTreinoDoDia(dataStr, objetivo) {
  const existentes = db.getWorkouts(dataStr);
  if (existentes.length > 0) return { treino: existentes[0], exercicios: db.getExercicios(existentes[0].id) };

  const idx = new Date(dataStr + "T00:00:00").getDay();
  const tmpl = (TREINO_SEMANAL[objetivo] ?? TREINO_SEMANAL.manter)[idx];
  if (tmpl.grupo === "Descanso") return { treino: null, exercicios: [] };

  const w = db.createWorkout({ nome: tmpl.grupo, dia_semana: DIAS_SEMANA_LABEL[idx], data: dataStr, exercicios: tmpl.exercicios });
  return { treino: w, exercicios: db.getExercicios(w.id) };
}

const FAVORITOS = [
  { nome: "Whey protein (30g)", kcal: 120 },
  { nome: "Creatina (5g)", kcal: 0 },

function CalorieRing({ consumido, meta }) {
  const pct = Math.min(consumido / meta, 1) || 0;
  const r = 70;
  const circ = 2 * Math.PI * r;
  const restante = Math.max(meta - consumido, 0);
  return (
    <div className="ring-wrap">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r={r} className="ring-track" />
        <circle cx="85" cy="85" r={r} className="ring-progress" strokeDasharray={circ} strokeDashoffset={circ - pct * circ} transform="rotate(-90 85 85)" />
      </svg>
      <div className="ring-center"><span className="ring-number">{restante}</span><span className="ring-label">kcal restantes</span></div>
    </div>
  );
}

function ModalFoto({ onFechar, onAdicionarItens }) {
  const [imagemPreview, setImagemPreview] = useState(null);
  const [imagemBase64, setImagemBase64] = useState(null);
  const [mediaType, setMediaType] = useState(null);
  const [analisando, setAnalisando] = useState(false);
  const [erro, setErro] = useState(null);
  const [resultado, setResultado] = useState(null); // { itens: [{nome, kcal}], total_kcal }
  const [marcados, setMarcados] = useState({});
  const [refeicao, setRefeicao] = useState("almoco");
  const inputCameraRef = useRef(null);
  const inputGaleriaRef = useRef(null);

  function escolherFoto(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setErro(null); setResultado(null);
    setMediaType(file.type || "image/jpeg");
    const reader = new FileReader();
    reader.onload = () => {
      setImagemPreview(reader.result);
      setImagemBase64(reader.result.split(",")[1]);
    };
    reader.readAsDataURL(file);
  }

  async function analisar() {
    if (!imagemBase64) return;
    setAnalisando(true); setErro(null);
    try {
      const res = await fetch("/api/analisar-foto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imagemBase64, mediaType }),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.erro || "Não consegui analisar essa foto");
      setResultado(json);
      const todosMarcados = {};
      json.itens.forEach((_, i) => { todosMarcados[i] = true; });
      setMarcados(todosMarcados);
    } catch (e) {
      setErro(e.message);
    } finally {
      setAnalisando(false);
    }
  }

  function confirmarAdicao() {
    const itensSelecionados = resultado.itens.filter((_, i) => marcados[i]);
    onAdicionarItens(refeicao, itensSelecionados);
  }

  return (
    <div className="modal-overlay" onClick={onFechar}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><span>Foto do prato</span><button className="icon-btn" onClick={onFechar}><Icon size={16}>✖</Icon></button></div>

        {!imagemPreview && (
          <>
            <p className="muted small">Escolha uma foto do prato — a IA identifica os alimentos e estima as calorias.</p>
            <input ref={inputCameraRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={escolherFoto} />
            <input ref={inputGaleriaRef} type="file" accept="image/*" style={{ display: "none" }} onChange={escolherFoto} />
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-pill primary" onClick={() => inputCameraRef.current?.click()}>📷 Tirar foto</button>
              <button className="btn-pill primary" onClick={() => inputGaleriaRef.current?.click()}>🖼️ Da galeria</button>
            </div>
          </>
        )}

        {imagemPreview && (
          <img src={imagemPreview} alt="Prato" style={{ width: "100%", borderRadius: 12, maxHeight: 220, objectFit: "cover" }} />
        )}

        {erro && <div className="hint-banner error-banner"><span>{erro}</span></div>}

        {imagemPreview && !resultado && (
          <button className="btn-pill primary full" disabled={analisando} onClick={analisar}>
            {analisando ? "Analisando prato..." : "Analisar prato"}
          </button>
        )}

        {resultado && (
          <>
            <select className="select-refeicao" value={refeicao} onChange={(e) => setRefeicao(e.target.value)}>
              {Object.entries(REFEICOES_LABEL).map(([key, label]) => <option key={key} value={key}>Adicionar em: {label}</option>)}
            </select>
            {resultado.itens.map((item, i) => (
              <div key={i} className="exercise-row" style={{ borderTop: i === 0 ? "none" : undefined }} onClick={() => setMarcados((m) => ({ ...m, [i]: !m[i] }))}>
                <div className={`checkbox ${marcados[i] ? "checkbox-checked" : ""}`}>{marcados[i] ? <Icon size={13} color="#fff">✔</Icon> : null}</div>
                <div className="exercise-info"><span className="exercise-name">{item.nome}</span></div>
                <span className="meal-kcal">{item.kcal} kcal</span>
              </div>
            ))}
            <button className="btn-pill primary full" onClick={confirmarAdicao}>Adicionar ao diário</button>
          </>
        )}
      </div>
    </div>
  );
}

function TelaProgresso({ historico, adicionarPeso, altura }) {
  const [novoPeso, setNovoPeso] = useState("");
  const temHistorico = historico.length > 0;
  const ultimo = historico[historico.length - 1]?.peso ?? 0;
  const primeiro = historico[0]?.peso ?? 0;
  const variacao = (ultimo - primeiro).toFixed(1);
  const imcNum = altura && ultimo ? ultimo / Math.pow(altura / 100, 2) : null;
  const imc = imcNum ? imcNum.toFixed(1) : "—";
  const classificacao = imcNum ? classificarIMC(imcNum) : null;
  const max = Math.max(...historico.map((h) => h.peso), 1);
  const min = Math.min(...historico.map((h) => h.peso), 0);
  const span = max - min || 1;
  function confirmar() { if (!novoPeso) return; adicionarPeso(Number(novoPeso)); setNovoPeso(""); }
  return (
    <div className="screen">
      <div className="screen-header"><h1 className="screen-title">Progresso</h1></div>
      {temHistorico && (
        <div className="grid-3">
          <div className="stat-chip"><div className="stat-icon" style={{ background: "#FF5A1F" }}><Icon size={16} color="#fff">📈</Icon></div><div className="stat-value">{ultimo.toFixed(1)}<span className="stat-unit">kg</span></div><div className="stat-label">Peso atual</div></div>
          <div className="stat-chip"><div className="stat-icon" style={{ background: "#1E8C4A" }}><Icon size={16} color="#fff">📈</Icon></div><div className="stat-value">{variacao > 0 ? `+${variacao}` : variacao}<span className="stat-unit">kg</span></div><div className="stat-label">Variação total</div></div>
          <div className="stat-chip"><div className="stat-icon" style={{ background: "#2F86D6" }}><Icon size={16} color="#fff">📈</Icon></div><div className="stat-value">{imc}</div><div className="stat-label">IMC</div></div>
        </div>
      )}
      {classificacao && (
        <div className="card">
          <span className="meal-title">Classificação do IMC</span>
          <div className="imc-mensagem" style={{ background: classificacao.cor }}>
            <strong>{classificacao.categoria}</strong> — {classificacao.mensagem}
          </div>
          <div className="imc-table">
            {FAIXAS_IMC.map((f, i) => (
              <div key={i} className={`imc-row ${f.categoria === classificacao.categoria ? "imc-row-active" : ""}`}>
                <span className="imc-dot" style={{ background: f.cor }} />
                <span className="imc-row-label">{f.categoria}</span>
                <span className="imc-row-range muted">{f.max === Infinity ? `≥ ${f.min}` : `${f.min} – ${f.max}`}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {temHistorico ? (
        <div className="card chart-card">
          <span className="meal-title">Evolução do peso</span>
          <div className="chart-area">
            <svg width="100%" height="140" viewBox="0 0 300 140" preserveAspectRatio="none">
              <polyline fill="none" stroke="#FF5A1F" strokeWidth="3" points={historico.map((h, i) => { const x = historico.length > 1 ? (i / (historico.length - 1)) * 280 + 10 : 150; const y = 120 - ((h.peso - min) / span) * 100; return `${x},${y}`; }).join(" ")} />
              {historico.map((h, i) => { const x = historico.length > 1 ? (i / (historico.length - 1)) * 280 + 10 : 150; const y = 120 - ((h.peso - min) / span) * 100; return <circle key={i} cx={x} cy={y} r="3.5" fill="#0E1E2B" />; })}
            </svg>
            <div className="chart-labels">{historico.map((h, i) => <span key={i}>{h.data}</span>)}</div>
          </div>
        </div>
      ) : <div className="card"><p className="muted small">Nenhum peso registrado ainda. Adicione o primeiro abaixo.</p></div>}
      <div className="card">
        <span className="meal-title">Registrar novo peso</span>

      </div>
    </div>
  );

function FitApp() {
  const [tab, setTab] = useState("hoje");
  const [perfil, setPerfil] = useState(null);
  const [pronto, setPronto] = useState(false);
  const [goals, setGoals] = useState(null);
  const [foodLogs, setFoodLogs] = useState([]);
  const [treino, setTreino] = useState(null);
  const [exercicios, setExercicios] = useState([]);
  const [selectedDia, setSelectedDia] = useState(HOJE);
  const [historicoPeso, setHistoricoPeso] = useState([]);
  const [aguaTotal, setAguaTotal] = useState(0);
  const [syncCode, setSyncCode] = useState(null);
  const [modalSyncAberto, setModalSyncAberto] = useState(false);
  const [sincronizando, setSincronizando] = useState(false);
  const [erroSync, setErroSync] = useState(null);

  const [passos, setPassos] = useState(0);
  const [contadorAtivo, setContadorAtivo] = useState(false);
  const streak = 4;

  // Contador de passos real, via acelerômetro do celular — sem sensor nativo
  // (isso não é um app instalado, é um site), então só conta enquanto essa
  // aba/app estiver aberto e na tela. Detecta picos no movimento vertical.
  const passosRef = useRef(0);
  const ultimoPicoRef = useRef(0);
  const magnitudeAnteriorRef = useRef(0);
  const subindoRef = useRef(false);

  function lidarComMovimento(event) {
    const acc = event.accelerationIncludingGravity || event.acceleration;
    if (!acc) return;
    const magnitude = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
    const agora = Date.now();

    if (magnitude > magnitudeAnteriorRef.current) {
      subindoRef.current = true;
    } else if (subindoRef.current && magnitude < magnitudeAnteriorRef.current) {
      // pico detectado — conta como passo se: força mínima de um passo real
      // e passou tempo suficiente desde o último (evita contar tremor como 2 passos)
      if (magnitudeAnteriorRef.current > 11.5 && agora - ultimoPicoRef.current > 300) {
        passosRef.current += 1;
        ultimoPicoRef.current = agora;
        setPassos(db.setSteps(HOJE, passosRef.current));
      }
      subindoRef.current = false;
    }
    magnitudeAnteriorRef.current = magnitude;
  }

  async function ativarContadorPassos() {
    passosRef.current = db.getSteps(HOJE);
    setPassos(passosRef.current);
    // iOS exige pedir permissão explicitamente, com um toque do usuário
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      try {
        const resposta = await DeviceMotionEvent.requestPermission();
        if (resposta !== "granted") { window.alert("Permissão de movimento negada — não dá pra contar passos sem ela."); return; }
      } catch { window.alert("Não foi possível pedir permissão de movimento neste navegador."); return; }
    }
    window.addEventListener("devicemotion", lidarComMovimento);
    setContadorAtivo(true);
  }

  useEffect(() => {
    return () => window.removeEventListener("devicemotion", lidarComMovimento);
  }, []);

  const carregarDoLocalStorage = useCallback(() => {
    const p = db.getPerfil();
    setSyncCode(db.getSyncCode());
    if (p) {
      setPerfil(p);
      setGoals(db.getGoals());
      setFoodLogs(db.getFoodLogs(HOJE));
      setHistoricoPeso(db.getWeightLogs().map((w) => ({ data: formatBR(w.data), peso: w.peso_kg })));
      setAguaTotal(db.getWaterTotal(HOJE));
      const { treino: t, exercicios: ex } = obterOuCriarTreinoDoDia(HOJE, p.objetivo);
      setTreino(t); setExercicios(ex);
    }
  }, []);

  const diasSemana = useMemo(() => montarDiasSemana(perfil?.objetivo ?? "manter"), [perfil?.objetivo]);

  function selecionarDia(dataStr) {
    setSelectedDia(dataStr);
    const { treino: t, exercicios: ex } = obterOuCriarTreinoDoDia(dataStr, perfil?.objetivo ?? "manter");
    setTreino(t); setExercicios(ex);
  }

  useEffect(() => { carregarDoLocalStorage(); setPronto(true); }, [carregarDoLocalStorage]);

  const enviarParaNuvem = useCallback(async (code) => {
    if (!code) return;
    try {
      await fetch("/api/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, data: db.coletarTudo() }) });
    } catch { /* offline ou API ainda não configurada — sem problema */ }
  }, []);

  async function puxarDaNuvem(code) {
    setSincronizando(true); setErroSync(null);
    try {
      const res = await fetch(`/api/sync?code=${encodeURIComponent(code)}`);
      const json = await res.json();
      if (!res.ok) throw new Error(json.erro || "Não encontrei dados para essa chave");
      db.aplicarTudo(json.data);
      db.saveSyncCode(code);
      carregarDoLocalStorage();
      setModalSyncAberto(false);
    } catch (e) { setErroSync(e.message); } finally { setSincronizando(false); }
  }

  async function sincronizarAgora() {
    setSincronizando(true); setErroSync(null);
    try { await enviarParaNuvem(syncCode); } finally { setSincronizando(false); }
  }

  const syncTimer = useRef(null);
  const syncCodeRef = useRef(null);
  syncCodeRef.current = syncCode;
  function agendarEnvio() {
    if (syncTimer.current) clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(() => enviarParaNuvem(syncCodeRef.current), 1500);
  }

  function finalizarOnboarding(dadosPerfil) {
    const salvo = db.savePerfil(dadosPerfil);
    setPerfil(salvo);
    const { treino: t, exercicios: ex } = obterOuCriarTreinoDoDia(HOJE, salvo.objetivo);
    setTreino(t); setExercicios(ex);
    const codigo = db.saveSyncCode(gerarCodigo());
    setSyncCode(codigo);
    enviarParaNuvem(codigo);
  }

  function limparDados() {
    if (!window.confirm("Isso apaga todos os dados salvos neste navegador. Tem certeza?")) return;
    db.limparTudo();
    setPerfil(null); setGoals(null); setFoodLogs([]); setTreino(null);
    setExercicios([]); setHistoricoPeso([]); setAguaTotal(0); setSyncCode(null);
  }

  const refeicoesPorChave = useMemo(() => {
    const agrupado = { cafe: [], almoco: [], lanche: [], jantar: [] };
    foodLogs.forEach((item) => { (agrupado[item.refeicao] ??= []).push(item); });
    return agrupado;
  }, [foodLogs]);

  function totalPorRefeicao(key) { return (refeicoesPorChave[key] ?? []).reduce((a, i) => a + i.kcal, 0); }
  const totalConsumido = useMemo(() => foodLogs.reduce((a, i) => a + i.kcal, 0), [foodLogs]);
  const macrosConsumidos = useMemo(() => ({
    proteina: Math.round(foodLogs.reduce((a, i) => a + (i.proteina_g || 0), 0)),
    carbo: Math.round(foodLogs.reduce((a, i) => a + (i.carbo_g || 0), 0)),
    gordura: Math.round(foodLogs.reduce((a, i) => a + (i.gordura_g || 0), 0)),
  }), [foodLogs]);

  const metaMacros = goals ? { proteina: goals.meta_proteina, carbo: goals.meta_carbo, gordura: goals.meta_gordura } : METAS_FALLBACK[perfil?.objetivo ?? "manter"];
  const metaCalorica = goals?.meta_calorica ?? METAS_FALLBACK[perfil?.objetivo ?? "manter"].calorias;

  function adicionarItem(key, nome, kcal) { db.addFoodLog({ nome, kcal, refeicao: key, data: HOJE }); setFoodLogs(db.getFoodLogs(HOJE)); agendarEnvio(); }
  function removerItem(id) { db.deleteFoodLog(id); setFoodLogs(db.getFoodLogs(HOJE)); agendarEnvio(); }
  function toggleExercicio(id, feito) { db.patchExercicio(id, { feito: feito ? 1 : 0 }); setExercicios((prev) => prev.map((e) => (e.id === id ? { ...e, feito: feito ? 1 : 0 } : e))); agendarEnvio(); }

  function recalcularComPeso(pesoKg) {
    if (!perfil?.altura_cm || !perfil?.data_nascimento) return;
    const idade = new Date().getFullYear() - new Date(perfil.data_nascimento).getFullYear();
    const metas = calcularMetas({ pesoKg, alturaCm: perfil.altura_cm, idade, sexo: perfil.sexo, objetivo: perfil.objetivo });
    setGoals(db.saveGoals(metas));
  }
  function adicionarPeso(peso) { db.addWeightLog({ peso_kg: peso, data: HOJE }); setHistoricoPeso(db.getWeightLogs().map((w) => ({ data: formatBR(w.data), peso: w.peso_kg }))); if (perfil?.meta_automatica) recalcularComPeso(peso); agendarEnvio(); }
  function ajustarAgua(delta) { setAguaTotal(db.addWater(HOJE, delta)); agendarEnvio(); }
  function setObjetivo(objetivo) { const novoPerfil = db.savePerfil({ ...perfil, objetivo }); setPerfil(novoPerfil); const ultimo = db.getWeightLogs().slice(-1)[0]; if (perfil?.meta_automatica && ultimo) recalcularComPeso(ultimo.peso_kg); agendarEnvio(); }
  function setMetaAutomatica(valor) { setPerfil(db.savePerfil({ ...perfil, meta_automatica: valor ? 1 : 0 })); agendarEnvio(); }
  function recalcular() {
    const ultimo = db.getWeightLogs().slice(-1)[0];
    if (!ultimo) { window.alert("Registre um peso na aba Progresso primeiro."); return; }
    recalcularComPeso(ultimo.peso_kg);
    // Também regenera o cronograma de treino da semana pra ficar compatível
    // com o objetivo atual — apaga os treinos já gerados dessa semana (e o
    // progresso marcado neles) e cria de novo a partir do novo modelo.
    db.limparTreinosDatas(semanaAtual());
    const { treino: t, exercicios: ex } = obterOuCriarTreinoDoDia(selectedDia, perfil.objetivo);
    setTreino(t); setExercicios(ex);
    agendarEnvio();
  }

  const TABS = [
    { key: "hoje", label: "Hoje", emoji: "🏠" },
    { key: "diario", label: "Refeição", emoji: "🍽️" },
    { key: "treino", label: "Treino", emoji: "🏋️" },
    { key: "progresso", label: "Progresso", emoji: "📈" },
    { key: "perfil", label: "Perfil", emoji: "👤" },
  ];

  return (
    <div className="app-outer">
      <div className="phone">
        <div className="notch" />
        <div className="status-bar">
          <span>9:41</span>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {pronto && perfil && (
              <>
                <button className="sync-icon-btn" onClick={() => setModalSyncAberto(true)} title="Chave de sincronização"><Icon size={15}>🔑</Icon></button>
                <button className="sync-icon-btn" onClick={sincronizarAgora} title="Sincronizar agora">
                  <span className={sincronizando ? "spin" : ""} style={{ display: "inline-flex", fontSize: 15 }}>🔄</span>
                </button>
              </>
            )}
            <span>●●●●</span>
          </div>
        </div>
        <div className="content">
          {!pronto && <div className="screen"><p className="muted small">Carregando...</p></div>}
          {pronto && !perfil && <TelaOnboarding onConcluir={finalizarOnboarding} />}
          {pronto && perfil && (
            <>
              {tab === "hoje" && <TelaHoje nome={perfil.nome} consumido={totalConsumido} meta={metaCalorica} macrosConsumidos={macrosConsumidos} metaMacros={metaMacros} agua={aguaTotal} ajustarAgua={ajustarAgua} passos={passos} contadorAtivo={contadorAtivo} ativarPassos={ativarContadorPassos} streak={streak} temMetaPersonalizada={!!goals} />}
              {tab === "diario" && <TelaDiario refeicoes={refeicoesPorChave} adicionarItem={adicionarItem} removerItem={removerItem} totalPorRefeicao={totalPorRefeicao} />}
              {tab === "treino" && <TelaTreino diasSemana={diasSemana} selectedDia={selectedDia} onSelecionarDia={selecionarDia} treino={treino} exercicios={exercicios} toggleExercicio={toggleExercicio} />}
              {tab === "progresso" && <TelaProgresso historico={historicoPeso} adicionarPeso={adicionarPeso} altura={perfil.altura_cm} />}
              {tab === "perfil" && <TelaPerfil perfil={perfil} setObjetivo={setObjetivo} setMetaAutomatica={setMetaAutomatica} recalcular={recalcular} onLimpar={limparDados} />}
            </>
          )}
        </div>
        {pronto && perfil && (
          <div className="tab-bar">
            {TABS.map((t) => (
              <button key={t.key} className={`tab-item ${tab === t.key ? "active" : ""}`} onClick={() => setTab(t.key)}><Icon size={20}>{t.emoji}</Icon><span>{t.label}</span></button>
            ))}
          </div>
        )}
        {modalSyncAberto && <ModalSync syncCode={syncCode} onFechar={() => { setModalSyncAberto(false); setErroSync(null); }} onEntrarComCodigo={puxarDaNuvem} sincronizando={sincronizando} erro={erroSync} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FitApp />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
  }
  // Transpila manualmente com runtime "classic" (React.createElement) — o
  // automático insere um `import`, que quebra fora de <script type="module">.
  window.addEventListener("load", function () {
    try {
      var codigoFonte = document.getElementById("fit-app-source").textContent;
      var transpilado = Babel.transform(codigoFonte, { presets: [["react", { runtime: "classic" }]] }).code;
      var script = document.createElement("script");
      script.text = transpilado;
      document.body.appendChild(script);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#8A1F1F;background:#FDECEC;border-radius:12px;max-width:390px;margin:24px auto;">' +
        "<strong>Erro ao carregar o app:</strong><br>" + e.message + "</div>";
    }
  });
</script>
</body>
</html>
